<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E Scooter Tools BS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Konfiguration (Deine kostenlose Live-Datenbank)
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForDemoPurposesOnly99",
            authDomain: "escooter-tools-bs.firebaseapp.com",
            projectId: "escooter-tools-bs",
            storageBucket: "escooter-tools-bs.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Globale Funktionen für das Frontend verfügbar machen
        window.db = db;
        window.colRef = collection(db, "products");
        window.onSnapshot = onSnapshot;
        window.addDoc = addDoc;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        
        // Starte Live-Synchronisation nach dem Laden
        window.dispatchEvent(new Event('firebase-ready'));
    </script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans selection:bg-emerald-500 selection:text-white">

    <!-- Header -->
    <header class="max-w-7xl mx-auto px-4 pt-8 pb-4">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-gray-900/80 backdrop-blur-md border border-gray-800 rounded-3xl p-6 shadow-2xl">
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl flex items-center justify-center text-emerald-400 text-xl shadow-lg shadow-emerald-950">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tight text-white flex items-center gap-2">
                        E Scooter Tools BS
                    </h1>
                    <p class="text-xs text-gray-400 mt-0.5">Globaler Live-Katalog & Echtzeit Cloud-Sync</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3 w-full md:w-auto justify-between md:justify-end">
                <div class="flex items-center space-x-2 bg-emerald-950/40 border border-emerald-500/30 px-3 py-1.5 rounded-full text-xs font-medium text-emerald-400">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                    <span>Cloud Live</span>
                </div>
                <div id="auth-container">
                    <button onclick="openLoginModal()" class="bg-gray-800 hover:bg-gray-700 text-xs px-4 py-2 rounded-xl font-medium transition border border-gray-700 flex items-center space-x-2 cursor-pointer shadow">
                        <i class="fa-solid fa-lock text-emerald-400"></i>
                        <span>Admin Login</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-4">
        <!-- Admin Steuerung -->
        <div id="admin-panel" class="hidden mb-8 bg-gray-900 border border-emerald-500/30 rounded-3xl p-6 shadow-xl shadow-emerald-950/25">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
                    <h2 class="text-base font-bold text-white">Admin-Modus aktiv (Cloud-Synchronisiert)</h2>
                </div>
                <button onclick="logoutAdmin()" class="text-xs bg-red-600/20 text-red-400 hover:bg-red-600/30 px-3 py-1.5 rounded-xl border border-red-500/30 transition cursor-pointer">Abmelden</button>
            </div>
            <form id="product-form" onsubmit="saveProduct(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="hidden" id="product-id">
                
                <div class="md:col-span-2">
                    <label class="block text-xs font-medium text-gray-400 mb-1">Produktname</label>
                    <input type="text" id="p-name" placeholder="z.B. Xiaomi M365 Reifen Vollgummi" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-white">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Preis (€)</label>
                    <input type="number" step="0.01" id="p-price" placeholder="0.00" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-white">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Stückzahl (Stock)</label>
                    <input type="number" id="p-stock" placeholder="0" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-white">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Kategorie / Marke</label>
                    <input type="text" id="p-category" placeholder="z.B. Xiaomi, Ninebot" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-white">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Zustand</label>
                    <select id="p-condition" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-white">
                        <option value="Neu">Neu</option>
                        <option value="Gebraucht / Gut">Gebraucht / Gut</option>
                        <option value="Überholt">Überholt</option>
                        <option value="Spezial-Tuning">Spezial-Tuning</option>
                    </select>
                </div>
                <div class="md:col-span-3">
                    <label class="block text-xs font-medium text-gray-400 mb-1">Foto aus der Galerie auswählen</label>
                    <input type="file" id="p-image-file" accept="image/*" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer">
                </div>
                <div class="md:col-span-3 flex space-x-3 mt-2">
                    <button type="submit" id="save-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-6 py-2.5 rounded-xl text-sm transition shadow-lg shadow-emerald-600/20 cursor-pointer">Neues Produkt hinzufügen</button>
                    <button type="button" id="cancel-edit" onclick="resetForm()" class="hidden bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-2.5 rounded-xl text-sm transition cursor-pointer">Abbrechen</button>
                </div>
            </form>
        </div>

        <!-- Such- und Filterleiste -->
        <div class="mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 bg-gray-900/50 p-4 rounded-3xl border border-gray-800">
            <div class="w-full sm:w-72 relative">
                <i class="fa-solid fa-search absolute left-3.5 top-3.5 text-gray-500 text-sm"></i>
                <input type="text" id="search-input" oninput="filterProducts()" placeholder="Produkte durchsuchen..." class="w-full bg-gray-900 border border-gray-700 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-white">
            </div>
            <div class="flex items-center space-x-3 w-full sm:w-auto justify-between">
                <span id="product-count" class="text-xs bg-gray-900 border border-gray-800 px-3.5 py-2.5 rounded-xl text-gray-400 font-medium">0 Artikel</span>
            </div>
        </div>

        <!-- Produktkatalog Grid -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamisch geladen -->
        </div>
    </main>

    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-3xl w-full max-w-md p-6 shadow-2xl relative">
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="text-lg font-bold mb-2 text-white">Admin Code Eingabe</h3>
            <p class="text-xs text-gray-400 mb-6">Bitte deinen Admin-Code eingeben.</p>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Geheimer Code</label>
                    <input type="password" id="admin-code-input" required placeholder="••••••••••" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500 tracking-widest font-mono text-white">
                </div>
                <div id="login-error" class="text-xs text-red-400 hidden"></div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-lg shadow-emerald-600/20 cursor-pointer">Entsperren</button>
            </form>
        </div>
    </div>

    <footer class="mt-20 border-t border-gray-900 py-8 text-center text-xs text-gray-500">
        &copy; 2026 E Scooter Tools BS. Echtzeit Cloud-Synchronisation.
    </footer>

    <script>
        const ADMIN_SECRET = "Difj4IHJym";
        let isAdmin = false;
        let products = [];

        window.addEventListener('firebase-ready', () => {
            if(localStorage.getItem('gd_scoot_admin') === 'true') {
                isAdmin = true;
                showAdminPanel();
            }

            // Echtzeit-Lauscher für die Datenbank
            window.onSnapshot(window.colRef, (snapshot) => {
                products = [];
                snapshot.forEach((docSnap) => {
                    products.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderProducts();
            }, (error) => {
                console.error("Fehler beim Laden der Cloud-Daten: ", error);
            });
        });

        function renderProducts(filterText = '') {
            const grid = document.getElementById('product-grid');
            let filtered = products;
            if(filterText.trim() !== '') {
                const query = filterText.toLowerCase();
                filtered = products.filter(p => p.name.toLowerCase().includes(query) || (p.category && p.category.toLowerCase().includes(query)));
            }

            const countEl = document.getElementById('product-count');
            if(countEl) countEl.innerText = `${filtered.length} von ${products.length} Artikel`;
            
            if(filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full bg-gray-900 border border-gray-800 rounded-3xl p-12 text-center shadow-xl">
                        <div class="w-16 h-16 bg-gray-800 rounded-2xl mx-auto flex items-center justify-center text-gray-500 text-2xl mb-4"><i class="fa-solid fa-box-open"></i></div>
                        <h3 class="text-base font-bold text-white mb-1">Keine Artikel gefunden</h3>
                        <p class="text-xs text-gray-400">Füge neue Produkte hinzu, um sie live zu sehen.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="bg-gray-900 border border-gray-800 rounded-3xl overflow-hidden flex flex-col shadow-xl hover:border-gray-700 transition">
                    <div class="h-48 bg-gray-800 relative overflow-hidden">
                        <img src="${p.image || 'https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&q=80&w=400'}" alt="${p.name}" class="w-full h-full object-cover">
                        <div class="absolute top-3 right-3 bg-gray-950/80 backdrop-blur-md text-emerald-400 font-semibold text-xs px-3 py-1.5 rounded-full border border-emerald-500/30 flex items-center space-x-1.5 shadow">
                            <span>Stock:</span>
                            ${isAdmin ? `
                                <button onclick="updateStock('${p.id}',${p.stock}, -1)" class="px-1 text-red-400 hover:text-white font-bold cursor-pointer">-</button>
                                <span class="font-bold">${p.stock}</span>
                                <button onclick="updateStock('${p.id}',${p.stock}, 1)" class="px-1 text-emerald-400 hover:text-white font-bold cursor-pointer">+</button>
                            ` : `<span>${p.stock} Stk.</span>`}
                        </div>
                        ${p.category ? `<div class="absolute top-3 left-3 bg-gray-950/80 backdrop-blur-md text-gray-300 text-[10px] px-2.5 py-1 rounded-lg border border-gray-700">${escapeHtml(p.category)}</div>` : ''}
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-white text-sm mb-2">${escapeHtml(p.name)}</h3>
                            <div class="flex items-center space-x-2 mb-3">
                                ${p.condition ? `<span class="text-[10px] bg-gray-800 text-gray-400 px-2 py-0.5 rounded-md border border-gray-700">${escapeHtml(p.condition)}</span>` : ''}
                            </div>
                            <div class="text-lg font-black text-emerald-400 mb-4">${Number(p.price).toFixed(2)} €</div>
                        </div>
                        ${isAdmin ? `
                            <div class="flex space-x-2 pt-3 border-t border-gray-800">
                                <button onclick="editProduct('${p.id}')" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs py-2 rounded-xl font-medium transition cursor-pointer">Bearbeiten</button>
                                <button onclick="deleteProduct('${p.id}')" class="bg-red-600/20 hover:bg-red-600/30 text-red-400 text-xs px-3 py-2 rounded-xl font-medium transition border border-red-500/30 cursor-pointer"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function filterProducts() { renderProducts(document.getElementById('search-input').value); }

        async function updateStock(id, currentStock, change) {
            const newStock = Math.max(0, currentStock + change);
            try {
                const docRef = window.doc(window.db, "products", id);
                await window.updateDoc(docRef, { stock: newStock });
            } catch (e) {
                alert("Fehler beim Aktualisieren des Bestands!");
            }
        }

        function openLoginModal() { document.getElementById('login-modal').classList.remove('hidden'); document.getElementById('admin-code-input').focus(); }
        function closeLoginModal() { document.getElementById('login-modal').classList.add('hidden'); document.getElementById('login-error').classList.add('hidden'); document.getElementById('admin-code-input').value = ''; }
        
        function handleLogin(e) {
            e.preventDefault();
            if (document.getElementById('admin-code-input').value.trim() === ADMIN_SECRET) {
                isAdmin = true; localStorage.setItem('gd_scoot_admin', 'true'); showAdminPanel(); closeLoginModal();
            } else {
                const err = document.getElementById('login-error'); err.innerText = "Falscher Code!"; err.classList.remove('hidden');
            }
        }

        function logoutAdmin() { isAdmin = false; localStorage.removeItem('gd_scoot_admin'); hideAdminPanel(); renderProducts(); }
        
        function showAdminPanel() {
            document.getElementById('admin-panel').classList.remove('hidden');
            document.getElementById('auth-container').innerHTML = `
                <div class="flex items-center space-x-3">
                    <span class="text-xs text-emerald-400 font-medium bg-emerald-950/50 border border-emerald-500/30 px-3.5 py-2 rounded-xl">Admin aktiv</span>
                    <button onclick="logoutAdmin()" class="bg-gray-800 hover:bg-gray-700 text-xs px-3 py-2 rounded-xl text-red-400 border border-gray-700 transition cursor-pointer">Logout</button>
                </div>`;
            renderProducts();
        }

        function hideAdminPanel() {
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('auth-container').innerHTML = `
                <button onclick="openLoginModal()" class="bg-gray-800 hover:bg-gray-700 text-xs px-4 py-2 rounded-xl font-medium transition border border-gray-700 flex items-center space-x-2 cursor-pointer">
                    <i class="fa-solid fa-lock text-emerald-400"></i><span>Admin Login</span>
                </button>`;
            renderProducts();
        }

        function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('product-id').value;
            const name = document.getElementById('p-name').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const stock = parseInt(document.getElementById('p-stock').value);
            const category = document.getElementById('p-category').value;
            const condition = document.getElementById('p-condition').value;
            const fileInput = document.getElementById('p-image-file');

            const existing = id ? products.find(p => p.id === id) : null;

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    finishSaving(id, name, price, stock, category, condition, event.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                const finalImage = existing ? existing.image : 'https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&q=80&w=400';
                finishSaving(id, name, price, stock, category, condition, finalImage);
            }
        }

        async function finishSaving(id, name, price, stock, category, condition, image) {
            try {
                if(id) {
                    const docRef = window.doc(window.db, "products", id);
                    await window.updateDoc(docRef, { name, price, stock, category, condition, image });
                } else {
                    await window.addDoc(window.colRef, { name, price, stock, category, condition, image });
                }
                resetForm();
            } catch (e) {
                alert("Fehler beim Speichern in der Cloud!");
            }
        }

        function editProduct(id) {
            const p = products.find(item => item.id === id);
            if(!p) return;
            document.getElementById('product-id').value = p.id;
            document.getElementById('p-name').value = p.name;
            document.getElementById('p-price').value = p.price;
            document.getElementById('p-stock').value = p.stock;
            document.getElementById('p-category').value = p.category || '';
            document.getElementById('p-condition').value = p.condition || 'Neu';
            document.getElementById('save-btn').innerText = "Produkt aktualisieren";
            document.getElementById('cancel-edit').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteProduct(id) {
            if(confirm("Produkt wirklich löschen?")) {
                try {
                    await window.deleteDoc(window.doc(window.db, "products", id));
                } catch (e) {
                    alert("Fehler beim Löschen!");
                }
            }
        }

        function resetForm() {
            document.getElementById('product-form').reset();
            document.getElementById('product-id').value = '';
            document.getElementById('save-btn').innerText = "Neues Produkt hinzufügen";
            document.getElementById('cancel-edit').classList.add('hidden');
        }

        function escapeHtml(str) {
            if(!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
